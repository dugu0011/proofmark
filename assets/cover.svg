<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowShield" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="240" cy="140" r="260" fill="url(#glowB)" filter="url(#soft)"/>
  <circle cx="1040" cy="520" r="280" fill="url(#glowP)" filter="url(#soft)"/>
  <circle cx="960" cy="300" r="300" fill="url(#glowShield)" filter="url(#soft)"/>

  <!-- wordmark -->
  <g transform="translate(80,86)">
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="url(#accent)"/>
    <text x="30" y="7" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#c7d2fe">PROOFMARK</text>
  </g>

  <!-- headline -->
  <text x="78" y="288" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-1" fill="#f4f7ff">PROOF,</text>
  <text x="78" y="392" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-1" fill="#f4f7ff">NOT <tspan fill="#7cb0ff">SUSPICION.</tspan></text>

  <!-- accent underline -->
  <rect x="80" y="418" width="560" height="6" rx="3" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="80" y="476" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#9fb0d6">The open-source AI pentester that proves what it finds.</text>

  <!-- url -->
  <g transform="translate(80,556)">
    <circle cx="6" cy="-6" r="6" fill="#22d3ee"/>
    <text x="24" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="600" fill="#c7d2fe">github.com/dugu0011/proofmark</text>
  </g>

  <!-- shield + proof check -->
  <g transform="translate(985,300) scale(2.6)">
    <path d="M0,-50 L40,-33 L40,7 C40,37 22,56 0,64 C-22,56 -40,37 -40,7 L-40,-33 Z"
          fill="#4f8cff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="3.4"/>
    <path d="M-17,-4 L-4,10 L21,-19" fill="none" stroke="#22d3ee" stroke-width="5.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
