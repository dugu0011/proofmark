<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" fill="none" role="img" aria-label="Proofmark — the AI pentester that proves what it finds">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="pm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="pm-blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pm-blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pm-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="pm-panel"><rect x="0" y="0" width="920" height="260" rx="22"/></clipPath>
    <clipPath id="pm-type"><rect x="150" y="150" width="0" height="34">
      <animate attributeName="width" values="0;372" dur="1.9s" begin="0.7s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#pm-panel)">
    <rect x="0" y="0" width="920" height="260" fill="url(#pm-bg)"/>

    <!-- drifting aurora -->
    <g filter="url(#pm-soft)">
      <circle r="130" fill="url(#pm-blob)">
        <animate attributeName="cx" values="220;360;220" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;150;70" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="url(#pm-blob2)">
        <animate attributeName="cx" values="760;620;760" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;80;200" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- a scan line sweeping down, like the agent working -->
    <rect x="0" width="920" height="2" fill="url(#pm-accent)" opacity="0.35">
      <animate attributeName="y" values="-4;264;-4" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- shield + proof check -->
    <g transform="translate(84,132)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3.2s" repeatCount="indefinite" additive="sum"/>
        <path d="M0,-50 L40,-33 L40,7 C40,37 22,56 0,64 C-22,56 -40,37 -40,7 L-40,-33 Z"
              fill="#4f8cff" fill-opacity="0.08" stroke="url(#pm-accent)" stroke-width="4"/>
        <path d="M-16,-6 L-3,8 L20,-18" fill="none" stroke="#22d3ee" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="80" stroke-dashoffset="80">
          <animate attributeName="stroke-dashoffset" values="80;0" dur="1.1s" begin="0.4s" fill="freeze"/>
          <animate attributeName="stroke-dashoffset" values="0;0;80;0" keyTimes="0;0.72;0.86;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- wordmark -->
    <text x="150" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#f4f7ff" letter-spacing="0.5">Proofmark</text>

    <!-- scanning underline -->
    <rect x="152" y="126" height="4" rx="2" fill="url(#pm-accent)" width="0">
      <animate attributeName="width" values="0;322;322" keyTimes="0;0.55;1" dur="2.1s" fill="freeze"/>
    </rect>

    <!-- tagline, typed -->
    <g clip-path="url(#pm-type)">
      <text x="152" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9fb0d6">the AI pentester that proves what it finds</text>
    </g>

    <!-- capability chips, fading in staggered -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c7d2fe">
      <g opacity="0" transform="translate(152,204)">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.4s" fill="freeze"/>
        <rect x="0" y="0" width="128" height="30" rx="15" fill="#4f8cff" fill-opacity="0.12" stroke="#4f8cff" stroke-opacity="0.5"/>
        <text x="16" y="20">Reproduced PoC</text>
      </g>
      <g opacity="0" transform="translate(292,204)">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.7s" fill="freeze"/>
        <rect x="0" y="0" width="132" height="30" rx="15" fill="#7c5cff" fill-opacity="0.12" stroke="#7c5cff" stroke-opacity="0.5"/>
        <text x="16" y="20">ed25519 signed</text>
      </g>
      <g opacity="0" transform="translate(436,204)">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.0s" fill="freeze"/>
        <rect x="0" y="0" width="112" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="16" y="20">Safe mode</text>
      </g>
      <g opacity="0" transform="translate(560,204)">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.3s" fill="freeze"/>
        <rect x="0" y="0" width="150" height="30" rx="15" fill="#4f8cff" fill-opacity="0.12" stroke="#4f8cff" stroke-opacity="0.5"/>
        <text x="16" y="20">Replayable record</text>
      </g>
    </g>

    <rect x="1" y="1" width="918" height="258" rx="21" fill="none" stroke="#2a3a66" stroke-opacity="0.6"/>
  </g>
</svg>
